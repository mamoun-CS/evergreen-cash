
workflows:
  ios-testflight:
    name: EverGreen CASH iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AppStoreConnect

    environment:
      groups:
        - ios_signing_credentials

      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Build Next.js Native
        script: npm run build:native

      - name: Sync Capacitor
        script: npm run cap

      - name: Set iOS build number
        script: |
          NEXT_IOS_BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST_APP_STORE_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
            if [ "$LATEST_APP_STORE_BUILD_NUMBER" -ge "$NEXT_IOS_BUILD_NUMBER" ]; then
              NEXT_IOS_BUILD_NUMBER=$((LATEST_APP_STORE_BUILD_NUMBER + 1))
            fi
          fi
          cd ios/App
          agvtool new-version -all "$NEXT_IOS_BUILD_NUMBER"

      - name: Initialize signing keychain
        script: keychain initialize

      - name: Fetch or create App Store signing files
        script: app-store-connect fetch-signing-files com.evergreen.cash --type IOS_APP_STORE --create

      - name: Install Apple Distribution certificate
        script: keychain add-certificates

      - name: Configure signing
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
